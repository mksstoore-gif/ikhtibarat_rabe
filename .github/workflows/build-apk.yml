name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

# A new push supersedes older builds. Only the newest APK should be published.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org sa.ikhtibarat --project-name ikhtibarat_rabe .
          fi
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="ikhtibarat_rabe"', 'android:label="اختبارات الصف الرابع"')
          p.write_text(s)
          PY

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: grade-four-tests-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Keep a stable, directly downloadable APK for phone-only installation.
      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          branch_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$GITHUB_SHA" != "$branch_head" ]; then
            echo "Skipping outdated APK: branch has moved to $branch_head"
            exit 0
          fi
          cp "$apk" "ikhtibarat-rabe-latest.apk"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest "ikhtibarat-rabe-latest.apk" --clobber
          else
            gh release create apk-latest "ikhtibarat-rabe-latest.apk" \
              --target "$GITHUB_SHA" \
              --title "اختبارات الصف الرابع - أحدث APK" \
              --notes "نسخة أندرويد التجريبية. إنشاء الاختبارات والملخصات وملفات PDF بدون تسجيل دخول." \
              --prerelease
          fi
