name: Deploy Web App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: write

concurrency:
  group: web-dist
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create web platform
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web --project-name ikhtibarat_rabe .
          fi
          rm -f test/widget_test.dart

      - name: Configure Arabic iPhone PWA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          index = Path("web/index.html")
          s = index.read_text()

          s = s.replace(
              "<title>ikhtibarat_rabe</title>",
              "<title>اختبارات الصف الرابع</title>"
          )
          s = s.replace(
              'content="ikhtibarat_rabe"',
              'content="اختبارات الصف الرابع"'
          )

          extra = """
          <meta name="theme-color" content="#6C5CE7">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="default">
          <meta name="apple-mobile-web-app-title" content="اختبارات رابع">
          <meta name="format-detection" content="telephone=no">
          <link rel="apple-touch-icon" href="icons/Icon-192.png">
          """
          if 'apple-mobile-web-app-capable' not in s:
              s = s.replace("</head>", extra + "\n</head>")

          s = s.replace(
              'content="width=device-width, initial-scale=1.0"',
              'content="width=device-width, initial-scale=1.0, viewport-fit=cover"'
          )
          index.write_text(s)

          manifest = Path("web/manifest.json")
          if manifest.exists():
              data = json.loads(manifest.read_text())
              data["name"] = "اختبارات الصف الرابع"
              data["short_name"] = "اختبارات رابع"
              data["description"] = "اختبارات وملخصات دراسية للصف الرابع الابتدائي"
              data["dir"] = "rtl"
              data["lang"] = "ar"
              data["display"] = "standalone"
              data["orientation"] = "portrait-primary"
              data["start_url"] = "."
              data["scope"] = "."
              data["background_color"] = "#F4F5FA"
              data["theme_color"] = "#6C5CE7"
              data["categories"] = ["education"]
              manifest.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2)
              )
          PY

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build Flutter web
        run: flutter build web --release --base-href "/" --pwa-strategy=none

      - name: Point web assets to CDN
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/web/index.html")
          s = p.read_text()
          s = s.replace(
              '<base href="/">',
              '<base href="https://cdn.jsdelivr.net/gh/mksstoore-gif/ikhtibarat_rabe@web-dist/">'
          )
          s = s.replace(
              '<link rel="manifest" href="manifest.json">',
              '<link rel="manifest" href="https://raw.githack.com/mksstoore-gif/ikhtibarat_rabe/web-dist/manifest.json">'
          )
          s = s.replace(
              'href="icons/Icon-192.png"',
              'href="https://cdn.jsdelivr.net/gh/mksstoore-gif/ikhtibarat_rabe@web-dist/icons/Icon-192.png"'
          )
          p.write_text(s)

          m = Path("build/web/manifest.json")
          if m.exists():
              import json
              data = json.loads(m.read_text())
              data["start_url"] = "index.html"
              data["scope"] = "./"
              m.write_text(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Publish web files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web-dist
          publish_dir: ./build/web
          force_orphan: true
