name: Deploy Web App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create web platform
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web --project-name ikhtibarat_rabe .
          fi
          rm -f test/widget_test.dart

      - name: Configure Arabic iPhone PWA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          index = Path("web/index.html")
          s = index.read_text()

          s = s.replace(
              "<title>ikhtibarat_rabe</title>",
              "<title>اختبارات الصف الرابع</title>"
          )
          s = s.replace(
              'content="ikhtibarat_rabe"',
              'content="اختبارات الصف الرابع"'
          )

          extra = """
          <meta name="theme-color" content="#6C5CE7">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="default">
          <meta name="apple-mobile-web-app-title" content="اختبارات رابع">
          <meta name="format-detection" content="telephone=no">
          <link rel="apple-touch-icon" href="icons/Icon-192.png">
          """
          if 'apple-mobile-web-app-capable' not in s:
              s = s.replace("</head>", extra + "\n</head>")

          s = s.replace(
              'content="width=device-width, initial-scale=1.0"',
              'content="width=device-width, initial-scale=1.0, viewport-fit=cover"'
          )
          index.write_text(s)

          manifest = Path("web/manifest.json")
          if manifest.exists():
              data = json.loads(manifest.read_text())
              data["name"] = "اختبارات الصف الرابع"
              data["short_name"] = "اختبارات رابع"
              data["description"] = "اختبارات وملخصات دراسية للصف الرابع الابتدائي"
              data["dir"] = "rtl"
              data["lang"] = "ar"
              data["display"] = "standalone"
              data["orientation"] = "portrait-primary"
              data["start_url"] = "."
              data["scope"] = "."
              data["background_color"] = "#F4F5FA"
              data["theme_color"] = "#6C5CE7"
              data["categories"] = ["education"]
              manifest.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2)
              )
          PY

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build Flutter web
        run: flutter build web --release --base-href "/ikhtibarat_rabe/"

      - name: Add offline PWA service worker
        run: |
          cat > build/web/sw.js <<'SW'
          const CACHE = 'grade-four-tests-v1';
          const CORE = [
            './',
            './index.html',
            './manifest.json',
            './flutter_bootstrap.js',
            './icons/Icon-192.png',
            './icons/Icon-512.png'
          ];

          self.addEventListener('install', event => {
            event.waitUntil(
              caches.open(CACHE).then(cache => cache.addAll(CORE))
            );
            self.skipWaiting();
          });

          self.addEventListener('activate', event => {
            event.waitUntil(
              caches.keys().then(keys =>
                Promise.all(keys.filter(key => key !== CACHE).map(key => caches.delete(key)))
              )
            );
            self.clients.claim();
          });

          self.addEventListener('fetch', event => {
            if (event.request.method !== 'GET') return;

            if (event.request.mode === 'navigate') {
              event.respondWith(
                fetch(event.request)
                  .then(response => {
                    const copy = response.clone();
                    caches.open(CACHE).then(cache => cache.put(event.request, copy));
                    return response;
                  })
                  .catch(() => caches.match('./index.html'))
              );
              return;
            }

            event.respondWith(
              caches.match(event.request).then(cached => {
                if (cached) return cached;
                return fetch(event.request).then(response => {
                  if (!response || response.status !== 200) return response;
                  const copy = response.clone();
                  caches.open(CACHE).then(cache => cache.put(event.request, copy));
                  return response;
                });
              })
            );
          });
          SW

          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/web/index.html")
          s = p.read_text()
          registration = """
          <script>
            if ('serviceWorker' in navigator) {
              window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
              });
            }
          </script>
          """
          if "register('sw.js')" not in s:
              s = s.replace("</body>", registration + "\n</body>")
          p.write_text(s)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
